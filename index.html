<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- iPhone（iOS）のホーム画面用アイコン -->
  <link rel="apple-touch-icon" href="icon.png">

  <!-- ブラウザのタブやAndroid用アイコン -->
  <link rel="icon" type="image/png" href="icon.png">
  <title>マイ・クローゼット</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      padding-bottom: 90px;
    }

    /* ヘッダー */
    header {
      background: #ffffff;
      padding: 14px;
      border-bottom: 1px solid #e5e5ea;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }

    /* カテゴリタブ（スクロール可能） */
    .nav-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5ea;
      overflow-x: auto;
      white-space: nowrap;
    }
    .tab-btn {
      background: #e5e5ea;
      color: #333;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #007aff;
      color: #fff;
    }

    /* メイングリッド表示 */
    .container { padding: 14px; }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 600px) {
      .item-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }

    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
    }
    .card-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #eee;
      display: block;
    }
    .card-body { padding: 8px 10px; }
    .card-cat { font-size: 0.7rem; color: #007aff; font-weight: bold; }
    .card-tags { font-size: 0.75rem; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 登録用フローティングボタン */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(0,123,255,0.4);
      z-index: 20;
      cursor: pointer;
    }

    /* モーダル共通スタイル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal.show { display: flex; }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 500px;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .close-btn {
      background: none; border: none; font-size: 1.5rem; color: #888; cursor: pointer;
    }

    .form-item { margin-bottom: 14px; }
    .form-item label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; }
    .form-item input, .form-item select {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem;
    }

    .submit-btn {
      width: 100%; background: #007aff; color: #fff; border: none; padding: 12px;
      border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
    }

    /* 写真拡大モーダル（ライトボックス） */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    .lightbox.show { display: flex; }
    .lightbox img { max-width: 90%; max-height: 55vh; border-radius: 8px; object-fit: contain; }
    
    .lightbox-info {
      color: #fff;
      text-align: center;
      margin-top: 12px;
      font-size: 0.95rem;
    }
    .lightbox-tools {
      margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }
    .btn-edit { background: #34c759; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-delete { background: #ff3b30; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-close-lb { background: #555; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>マイ・クローゼット</h1>
  </header>

  <!-- カテゴリタブ -->
  <nav class="nav-tabs" id="tabContainer">
    <button class="tab-btn active" data-cat="すべて">すべて</button>
    <button class="tab-btn" data-cat="トップス">トップス</button>
    <button class="tab-btn" data-cat="アウター">アウター</button>
    <button class="tab-btn" data-cat="パンツ">パンツ</button>
    <button class="tab-btn" data-cat="帽子">帽子</button>
    <button class="tab-btn" data-cat="ファッション小物">ファッション小物</button>
    <button class="tab-btn" data-cat="バッグ">バッグ</button>
  </nav>

  <!-- 服一覧エリア -->
  <main class="container">
    <div class="item-grid" id="gridArea"></div>
  </main>

  <!-- 服を登録ボタン -->
  <button class="fab" id="openAddModalBtn">＋ 服を登録</button>

  <!-- 新規登録モーダル画面 -->
  <div class="modal" id="addModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">服を新しく登録</h3>
        <button class="close-btn" id="closeAddModalBtn">&times;</button>
      </div>
      <form id="addForm">
        <div class="form-item" id="fileInputContainer">
          <label>写真を選択/撮影</label>
          <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="form-item">
          <label>カテゴリ</label>
          <select id="catSelect">
            <option value="トップス">トップス</option>
            <option value="アウター">アウター</option>
            <option value="パンツ">パンツ</option>
            <option value="帽子">帽子</option>
            <option value="ファッション小物">ファッション小物</option>
            <option value="バッグ">バッグ</option>
          </select>
        </div>
        <div class="form-item">
          <label>タグ/説明 (カンマ区切り)</label>
          <input type="text" id="tagInput" placeholder="例: 黒, 夏物, お気に入り">
        </div>
        <button type="submit" class="submit-btn" id="submitBtnText">登録する</button>
      </form>
    </div>
  </div>

  <!-- 写真拡大＆編集モーダル -->
  <div class="lightbox" id="lightbox">
    <img id="lbImg" src="" alt="拡大写真">
    <div class="lightbox-info" id="lbInfo"></div>
    <div class="lightbox-tools">
      <button class="btn-edit" id="editBtn">✏️ タグを編集</button>
      <button class="btn-delete" id="deleteBtn">🗑️ 削除</button>
      <button class="btn-close-lb" id="closeLbBtn">閉じる</button>
    </div>
  </div>

  <script>
    // LocalStorageからデータを読み込む（保存データがなければ初期データを使用）
    let items = JSON.parse(localStorage.getItem('my_closet_items')) || [
      { id: 1, cat: 'トップス', img: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500', tags: '白T, 夏物' },
      { id: 2, cat: 'パンツ', img: 'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500', tags: 'デニム' },
      { id: 3, cat: 'アウター', img: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500', tags: 'ジャケット, 黒' }
    ];

    // データをLocalStorageに保存する関数
    function saveItems() {
      localStorage.setItem('my_closet_items', JSON.stringify(items));
    }

    let currentCat = 'すべて';
    let selectedId = null;
    let isEditing = false;

    const gridArea = document.getElementById('gridArea');
    const addModal = document.getElementById('addModal');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbInfo = document.getElementById('lbInfo');

    // 一覧描画処理
    function render() {
      gridArea.innerHTML = '';
      const list = items.filter(i => currentCat === 'すべて' || i.cat === currentCat);
      
      if (list.length === 0) {
        gridArea.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#888; padding:30px;">アイテムがありません</p>';
        return;
      }

      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <img src="${item.img}" class="card-img" alt="">
          <div class="card-body">
            <div class="card-cat">${item.cat}</div>
            <div class="card-tags">#${item.tags.replace(/,/g, ' #')}</div>
          </div>
        `;
        div.addEventListener('click', () => {
          selectedId = item.id;
          lbImg.src = item.img;
          lbInfo.innerHTML = `<b>[${item.cat}]</b> #${item.tags.replace(/,/g, ' #')}`;
          lightbox.classList.add('show');
        });
        gridArea.appendChild(div);
      });
    }

    // カテゴリタブ切り替えイベント
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCat = e.target.getAttribute('data-cat');
        render();
      });
    });

    // 新規登録モーダルを開く
    document.getElementById('openAddModalBtn').addEventListener('click', () => {
      isEditing = false;
      document.getElementById('modalTitle').innerText = '服を新しく登録';
      document.getElementById('submitBtnText').innerText = '登録する';
      document.getElementById('fileInputContainer').style.display = 'block';
      document.getElementById('fileInput').required = true;
      document.getElementById('addForm').reset();
      addModal.classList.add('show');
    });

    // モーダルを閉じる
    document.getElementById('closeAddModalBtn').addEventListener('click', () => addModal.classList.remove('show'));
    document.getElementById('closeLbBtn').addEventListener('click', () => lightbox.classList.remove('show'));

    // 削除処理
    document.getElementById('deleteBtn').addEventListener('click', () => {
      if (selectedId && confirm('このアイテムを削除しますか？')) {
        items = items.filter(i => i.id !== selectedId);
        saveItems(); // 変更を保存
        lightbox.classList.remove('show');
        render();
      }
    });

    // タグ編集ボタンを押したとき
    document.getElementById('editBtn').addEventListener('click', () => {
      const targetItem = items.find(i => i.id === selectedId);
      if (!targetItem) return;

      lightbox.classList.remove('show');

      isEditing = true;
      document.getElementById('modalTitle').innerText = 'タグ・カテゴリを編集';
      document.getElementById('submitBtnText').innerText = '変更を保存する';
      document.getElementById('fileInputContainer').style.display = 'none';
      document.getElementById('fileInput').required = false;

      document.getElementById('catSelect').value = targetItem.cat;
      document.getElementById('tagInput').value = targetItem.tags;

      addModal.classList.add('show');
    });

    // フォーム送信（新規登録 or 編集保存）
    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const cat = document.getElementById('catSelect').value;
      const tags = document.getElementById('tagInput').value || 'なし';

      if (isEditing) {
        const targetItem = items.find(i => i.id === selectedId);
        if (targetItem) {
          targetItem.cat = cat;
          targetItem.tags = tags;
          saveItems(); // 変更を保存
        }
        isEditing = false;
        addModal.classList.add('show').remove(); // 微調整
        addModal.classList.remove('show');
        render();
      } else {
        const file = document.getElementById('fileInput').files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            items.unshift({
              id: Date.now(),
              cat: cat,
              img: evt.target.result,
              tags: tags
            });
            saveItems(); // 新規データを保存
            render();
            addModal.classList.remove('show');
            document.getElementById('addForm').reset();
          };
          reader.readAsDataURL(file);
        }
      }
    });

    // 初期起動
    render();
  </script>
</body>
</html>
